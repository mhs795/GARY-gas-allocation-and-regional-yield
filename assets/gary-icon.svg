<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="flame" gradientUnits="userSpaceOnUse" x1="128" y1="20" x2="128" y2="216">
      <stop offset="0" stop-color="#A5F3FC"/>
      <stop offset="0.35" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="core" gradientUnits="userSpaceOnUse" x1="124" y1="104" x2="124" y2="208">
      <stop offset="0" stop-color="#FEF9C3"/>
      <stop offset="0.45" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="pipe" gradientUnits="userSpaceOnUse" x1="0" y1="220" x2="0" y2="238">
      <stop offset="0" stop-color="#E2E8F0"/>
      <stop offset="1" stop-color="#64748B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.6" r="0.5">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="256" height="256" rx="52" fill="url(#bg)"/>
  <circle cx="126" cy="146" r="108" fill="url(#glow)"/>

  <!-- outer gas flame, with a lick curling in on the left -->
  <path d="M130 20
           C130 58, 168 76, 176 116
           C184 152, 175 187, 149 205
           C133 216, 111 217, 95 209
           C69 196, 57 166, 63 136
           C67 114, 79 100, 88 91
           C86 108, 92 121, 104 127
           C99 95, 111 53, 130 20 Z"
        fill="url(#flame)"/>

  <!-- inner cone -->
  <path d="M124 106
           C138 132, 153 147, 149 171
           C145 196, 133 207, 120 206
           C107 205, 97 193, 97 171
           C97 147, 112 130, 124 106 Z"
        fill="url(#core)"/>

  <!-- burner pipe with nodal connectors -->
  <rect x="52" y="222" width="152" height="13" rx="6.5" fill="url(#pipe)"/>
  <circle cx="52" cy="228" r="13" fill="#E2E8F0"/>
  <circle cx="204" cy="228" r="13" fill="#E2E8F0"/>
  <circle cx="52" cy="228" r="5.5" fill="#0B1220"/>
  <circle cx="204" cy="228" r="5.5" fill="#0B1220"/>
</svg>
